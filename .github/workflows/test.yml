name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

# A newer push to the same branch/PR cancels the older run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # Fast, clear failures first: types, then a real build, then tests by widening scope.
      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test (simple)
        run: bun run test:simple

      - name: Test (full)
        run: bun run test:full

      - name: Test (edge, including slow paths)
        run: bun run test:edge:slow

      - name: Build documentation
        run: bun run docs:build

      - name: Test framework production builds
        run: bun run test:framework
